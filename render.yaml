# Render Blueprint for Football Auction Platform
services:
  # Backend Web Service (Express + Socket.io)
  - type: web
    name: football-auction-server
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: football-auction-client
          property: url
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Frontend Static Site (React Vite)
  - type: web
    name: football-auction-client
    runtime: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: football-auction-server
          property: url
